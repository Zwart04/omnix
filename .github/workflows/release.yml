name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Check CLI-only build (Linux)
        if: runner.os == 'Linux'
        run: cargo check --no-default-features

      - name: Build release binary
        run: cargo build --release

      - name: Package Debian (Linux)
        if: runner.os == 'Linux'
        run: sh dist/linux/build-deb.sh

      - name: Package Arch Linux (Linux)
        if: runner.os == 'Linux'
        run: sh dist/linux/build-arch.sh

      - name: Stage Linux updater binary
        if: runner.os == 'Linux'
        run: cp target/release/omnix dist/linux/omnix-linux-x64

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/windows/build-installer.ps1

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          sh dist/macos/build-app.sh \
            --binary target/aarch64-apple-darwin/release/omnix \
            --binary target/x86_64-apple-darwin/release/omnix

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: omnix-linux-x64
          path: |
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/omnix-linux-x64
          if-no-files-found: error

      - name: Attach Linux packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/*.deb
            dist/linux/*.pkg.tar.zst
            dist/linux/omnix-linux-x64

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: omnix-windows-x64
          path: dist/windows/build/omnix-setup-x64.exe
          if-no-files-found: error

      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/build/omnix-setup-x64.exe

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: omnix-macos
          path: dist/macos/Omnix-*-macos*.dmg
          if-no-files-found: error

      - name: Attach macOS DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/Omnix-*-macos*.dmg
