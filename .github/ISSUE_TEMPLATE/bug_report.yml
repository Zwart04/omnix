name: Bug report
description: Something in Omnix does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove private paths, client names, tokens, and
        transcript contents before submitting. Security issues go through
        SECURITY.md, not this form.
  - type: input
    id: version
    attributes:
      label: Omnix version
      description: Output of `omnix --version` or the version chip.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop / compositor
      description: X11, Wayland, GNOME, KDE, etc. Skip on Windows/macOS.
      placeholder: "Wayland / GNOME 46"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Open Settings → Plugins
        2. Install ./examples/plugins/hello-command
        3. Run the command
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the terminal output or `omnix plugin doctor` output.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Idle RAM/CPU measurements, logs, screenshots with private data removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, tokens, cookies, private paths, and client names.
          required: true
