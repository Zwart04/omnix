[package]
name = "perch"
version = "0.1.0"
edition = "2024"
description = "A light Rust workbench for worktrees, agent sessions, and a swappable browser."

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao", "dep:portable-pty"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
portable-pty = { version = "0.9", optional = true }
