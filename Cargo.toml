[package]
name = "omnix"
version = "0.3.6"
edition = "2024"
description = "A light Rust desktop workbench for terminals, worktrees, agent sessions, and a swappable browser."
license = "MIT"
repository = "https://github.com/Zwart04/omnix"
rust-version = "1.85"

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao", "dep:portable-pty"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
portable-pty = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
