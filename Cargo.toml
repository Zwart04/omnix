[package]
name = "omnix"
version = "0.7.2"
edition = "2024"
description = "A light Rust desktop workbench for terminals, worktrees, agent sessions, and a swappable browser."
license = "GPL-3.0-or-later"
repository = "https://github.com/Zwart04/omnix"
rust-version = "1.85"

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao", "dep:portable-pty", "dep:gtk", "dep:webkit2gtk", "dep:soup3"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
portable-pty = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2", features = ["v2_20"], optional = true }
soup3 = { version = "0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
